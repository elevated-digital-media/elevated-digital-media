<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Elevated Digital & Media</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #cde9f2 0%, #eaf4f9 45%, #ffffff 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .thankyou-card {
            background: #ffffff;
            border: 3px solid #1a4d2e;
            border-radius: 26px;
            padding: 50px 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(26, 77, 46, 0.12);
        }
        .success-icon {
            font-size: 54px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 900;
            color: #1a4d2e;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: #334155;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .home-btn {
            display: inline-block;
            background: #dc2626;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.35);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .home-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="thankyou-card">
        <div class="success-icon">✉️✨</div>
        <h1>Message Received!</h1>
        <p>Thank you for reaching out to <strong>Elevated Digital & Media</strong>. We have successfully received your project inquiry and will review your details shortly. We look forward to collaborating with you and will get back to you within 24 hours.</p>
        <a href="https://elevated-digital-media.vercel.app" class="home-btn">Return to Homepage</a>
    </div>

</body>
</html>
